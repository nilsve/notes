[package]
name = "orm"
version = "0.1.0"
edition = "2021"

# A tiny Postgres backed repository/CRUD layer shared by the app crates.
# See `src/repository/mod.rs` for the traits and `src/db.rs` for connectivity.

[dependencies]
sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "tls-rustls-ring-webpki",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "derive",
] }
async-trait = "0.1.92"
actix-web = "4"
anyhow = "1.0.104"
thiserror = "2.0.21"
