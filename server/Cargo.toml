[package]
name = "server"
version = "0.1.0"
edition = "2021"

[dependencies]
thiserror = "2.0.21"
async-trait = "0.1.92"
rust-bert = { version = "0.23.0" }
weaviate-community = "0.2.2"
dotenvy = "0.15"
chrono = { version = "0.4.45", features = ["serde"] }
orm = { path = "../orm" }
actix-web = "4"
sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "tls-rustls-ring-webpki",
    "postgres",
    "uuid",
    "chrono",
    "json",
] }
serde = { version = "1.0.229", features = ["derive"] }
apistos = { version = "0.9.0", features = ["extras", "qs_query"] }
schemars = { package = "apistos-schemars", version = "0.8" }
actix-cors = "0.7.2"
actix-files = "0.7.0"
env_logger = "0.11.11"
tokio = "1.53.2"
serde_json = "1.0.151"
anyhow = "1.0.104"
openai-api-rs = "10.0.2"
futures-util = "0.3.34"
actix-ws = "0.4.0"
[dependencies.uuid]
version = "1.27.0"
features = [
    "v4", # Lets you generate random UUIDs
    "fast-rng", # Use a faster (but still sufficiently random) RNG
    "macro-diagnostics", # Enable better diagnostics for compile-time UUIDs
]
