services:
  server:
    build: .
    ports:
      - "1337:1337"
    env_file:
      - .env
    environment:
      - PORT=1337
      - WEAVIATE_HOSTNAME=weaviate
      - WEAVIATE_PORT=8080
      - DATABASE_URL=postgres://incidents:incidents@postgres:5432/incidents
    depends_on:
      postgres:
        condition: service_healthy
      weaviate:
        condition: service_started
    networks:
      - internal

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: incidents
      POSTGRES_PASSWORD: incidents
      POSTGRES_DB: incidents
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidents -d incidents"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  weaviate:
    hostname: weaviate
    image: cr.weaviate.io/semitechnologies/weaviate:1.24.10
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - weaviate_data:/var/lib/weaviate
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'none'
      CLUSTER_HOSTNAME: 'node1'
    networks:
      - internal

volumes:
  weaviate_data:
  postgres_data:

networks:
  internal:
