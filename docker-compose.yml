services:
  server:
    build: .
    ports:
      - "1337:1337"
    env_file:
      - .env
    environment:
      - PORT=1337
      - WEAVIATE_HOSTNAME=weaviate
      - WEAVIATE_PORT=8080
      - DATABASE_URL=postgres://incidents:incidents@postgres:5432/incidents
      # Where rust-bert caches the sentence-embedding model. Without a volume the
      # ~90MB of all-MiniLM-L12-V2 weights are re-downloaded from Hugging Face on
      # every container start.
      - RUSTBERT_CACHE=/var/cache/rustbert
    volumes:
      - rustbert_cache:/var/cache/rustbert
    depends_on:
      postgres:
        condition: service_healthy
      weaviate:
        condition: service_started
    networks:
      - internal

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: incidents
      POSTGRES_PASSWORD: incidents
      POSTGRES_DB: incidents
    # No published ports on purpose: Postgres is only reachable from the
    # `internal` docker network (i.e. the server container). Nothing on the host
    # and no other container can open a connection to it.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidents -d incidents"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  weaviate:
    hostname: weaviate
    image: cr.weaviate.io/semitechnologies/weaviate:1.24.10
    # No published ports on purpose: only the server container talks to Weaviate,
    # over the `internal` docker network. Nothing on the host and no other
    # container can reach it.
    volumes:
      - weaviate_data:/var/lib/weaviate
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'none'
      CLUSTER_HOSTNAME: 'node1'
    networks:
      - internal

volumes:
  weaviate_data:
  postgres_data:
  rustbert_cache:

networks:
  internal:
